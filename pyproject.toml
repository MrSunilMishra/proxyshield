[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyshield"
version = "1.0.0"
description = "Advanced CFonts-Style Terminal Typography & Branding Engine"
authors = [{ name = "Quarkova", email = "contact@quarkova.com" }]
license = { text = "MIT" }
readme = "docs/BRANDING.md"
requires-python = ">=3.9"
dependencies = [
    "pyfiglet>=1.0.2",
    "rich>=13.0.0",
    "colorama>=0.4.6",
    "httpx>=0.27.0",
    "PySocks>=1.7.1",
    "dnspython>=2.6.0",
    "psutil>=6.0.0",
    "pydantic>=2.7.0",
    "SQLAlchemy>=2.0.0",
    "Jinja2>=3.1.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://quarkova.com"

[project.scripts]
proxyshield = "proxyshield.cli:main"
pxs = "proxyshield.cli:main"

